[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bob-search"
version = "0.1.0"
description = "Bob data source for Bella — catalysis-hub.org integration"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
bob = "bob:main"

[tool.setuptools]
py-modules = ["bob", "bob_search"]
packages = ["plugins"]
