[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bella-sim"
version = "0.2.0"
description = "Lightweight Universal Simulator"
requires-python = ">=3.10"
dependencies = [
    "ase>=3.20",
    "joblib>=1.3",
    "mp-api>=0.41",
    "mpmath>=1.3",
    "numpy>=1.24",
    "phonopy>=2.20",
    "prompt-toolkit>=3.0",
    "psutil>=5.9",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "rich>=13.0",
    "scipy>=1.11",
    "setuptools>=68",
    "spglib>=2.0",
]

[project.optional-dependencies]
mace = ["mace-torch>=0.3"]
viz = ["pyvista>=0.42"]
full = ["mace-torch>=0.3", "pyvista>=0.42"]

[project.scripts]
bella = "bella:main"

[tool.setuptools]
py-modules = ["bella", "bella_validate", "bella_phonon", "llm"]
packages = ["plugins"]
